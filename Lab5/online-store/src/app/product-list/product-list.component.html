<div class="product-list">
  <app-product-item 
    *ngFor="let product of products"
    [product]="product"
    [isFavoriteMode]="isFavoritesList"
    (delete)="onDelete($event)"
    (toggleFavourite)="onToggleFavourite($event)">
  </app-product-item>

  <p *ngIf="products.length === 0">
    {{ isFavoritesList ? 'No favorite products yet' : 'В этой категории пока нет продуктов' }}
  </p>
</div>
