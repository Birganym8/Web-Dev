<h2>Categories</h2>
<div class="categories">
  <button *ngFor="let category of categories" (click)="selectCategory(category.id)">
    {{ category.name }}
  </button>
</div>


<div class="favorites-bar" *ngIf="favorites.length > 0">
  ⭐ Favorites ({{ favorites.length }})
  <app-product-list
    [products]="favorites"
    [isFavoritesList]="true"
    (delete)="removeFromFavorites($event)">
  </app-product-list>
</div>

<h2>Products</h2>
<div *ngIf="selectedProducts.length > 0">
  <app-product-list
    [products]="selectedProducts"
    (toggleFavourite)="toggleFavorite($event)">
  </app-product-list>
</div>
<p *ngIf="selectedProducts.length === 0 && selectedCategoryId">No products in this category</p>
